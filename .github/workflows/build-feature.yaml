name: Build Feature Branch

on:
  pull_request:
    branches: [ develop ]
    types: [ opened, reopened, synchronize ]
  push:
    branches:
      - 'feature/**'

jobs:
  build-feature:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Si es PR usa la cabecera del PR; si es push directo usa el commit actual
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven # setup-java maneja el cache de Maven automáticamente sin necesidad de actions/cache

      - name: Build with Maven
        run: |
          mvn clean test package
          echo "build with maven"

#######################################################
# Automatic merge to develop branch
#######################################################
  merge-feature-into-develop:
    runs-on: ubuntu-latest
    needs: build-feature
    # Solo ejecuta el merge si la compilación fue exitosa Y el evento fue un Pull Request
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == false
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0

      - name: Merge feature branch into develop
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Traer los cambios más recientes del repositorio remoto
          git fetch origin ${{ github.head_ref }}
          
          # Ejecutar el merge
          git merge --no-ff --verbose origin/${{ github.head_ref }} -m "Merge pull request #${{ github.event.number }} from ${{ github.head_ref }}"

      - name: Push changes to develop
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.base_ref }}