name: Publish jar as artifact 
on:
  # Este workflow se dispara cuando se recibe un evento de repository_dispatch con el tipo "publish-artifact-event". Que será lanzado desde el workflow build-feature.yaml
  repository_dispatch:
    types: [publish-artifact-event]
jobs:
  dowlonad-artifact-job:
    runs-on: ubuntu-latest
    # ARTIFACT_NAME es el nombre del archivo jar que se va a publicar como artifact. Github lo nombra como "variables", pero por lo visto más bien es una constante que luego puede ser usada en el workflow, por eso se define como env
    env:
      ARTIFACT_NAME: 'customer-0.0.1-SNAPSHOT.jar'
    permissions:
      contents: write
      pull-requests: write
    # github.event.client_payload.base_branch viene dado como parametro por el workflow build-feature.yaml, que es el que lanza este workflow. Es el nombre de la rama base (develop) desde donde se va a descargar el código fuente para compilarlo y generar el artifact  
    steps:      
      - name: Debug Payload
        run: |     
         echo ${{ github.event.client_payload.base_branch }}
               
      ######################################################## 
      # 1- Descargar el código fuente de la rama por defecto para poder recuperar el Dockerfile y subirlo como contexto de compilación de docker
      ########################################################
      
      - uses: actions/checkout@v4  
        with:
          ref: ${{ github.event.client_payload.base_branch }}
          fetch-depth: 0      

      - name: check last hashid
        run: |
          git log -2 

      ########################################################
      # 2- setup java 17 and check that source code is buildable
      ########################################################
      - name: setup java 17 
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '17'

      - name: Cache local Maven repository
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: build with maven
        #The "SNAPSHOT" term means that the build is a snapshot of your code at a given time    
        #The --batch-mode flag indicates that the build should be run without any user interaction
        #(Avoid caching versions of your own code)The --update-snapshots flag tells Maven to check for any updated snapshots of dependencies and use those instead of the versions specified in the project's pom.xml file. 
        #The package argument tells Maven to package the project into a distributable format, such as a JAR or WAR file.
        run: |
           mvn clean test package -DskipTests=true --batch-mode --update-snapshots      
           echo ls -R target/
           echo ls -la 
    
             
      ######################################################## 
      # 4- Publicar el artifact
      ######################################################## 
      - name: Publish Package
        if: success()
        uses: actions/upload-artifact@v4
        with:
         name: artifactjar
         path: ${{ github.workspace }}/target/${{ env.ARTIFACT_NAME }}


      ######################################################## 
      # 5- Comprobar que el artifact descargado es el mismo que el publicado, y no está corrupto. 
      # Se guarda el checksum del artifact en un JSON, que se usará más adelante ( mirar por JSON_PAYLOAD )
      ######################################################## 
      - name: Verify SHA1sum
        if: success()
        id: cal_checksum_jar
        run: |
          ls -la ${{ github.workspace }}/target/        
          SHA1=$(sha1sum ${{ github.workspace }}/target/$ARTIFACT_NAME | awk '{print $1}')
          JSON=\''{"message": "publish artifact","artifact_name":"'"$ARTIFACT_NAME"'", "checksum": "'"$SHA1"'"}'\'
          echo JSON_PAYLOAD=$(printf '%s\n' "$JSON")  >> $GITHUB_ENV

      ######################################################## 
      # 4- Llamar al workflow: deploy-artifact.yaml pasando como payload el nombre del artifact y su checksum, para que el workflow deploy-artifact.yaml pueda descargarlo y comprobar que es el mismo que se ha publicado.
      #########################################################
      - name: trigger deploy artifact
        if: success()
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          event-type: deploy-artifact-event        # el nombre del evento que se va a lanzar, es el que se ha definido en el workflow deploy-artifact.yaml   
          client-payload: ${{fromJSON(env.JSON_PAYLOAD) }}         